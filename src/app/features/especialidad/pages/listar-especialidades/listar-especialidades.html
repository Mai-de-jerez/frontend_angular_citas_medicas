<div class="container">
  <h1>Seleccione una Especialidad</h1>

  @if (cargando()) {
    <p class="loading">Cargando especialidades...</p>
  } @else {
    <div class="tabla-wrapper">
      <table>
        <thead>
          <tr>
            <th>Especialidad</th>
            <th class="col-acciones">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (esp of especialidades(); track esp.id) {
            <tr>
              <td><strong>{{ esp.nombre }}</strong></td>
              <td class="col-acciones">
                <button class="btn-ver" (click)="cogerCita(esp.id)">
                  Coger Cita
                </button>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="2" class="text-center">No hay especialidades disponibles</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
